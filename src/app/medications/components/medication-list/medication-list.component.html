<div class="table-container">
  <table mat-table [dataSource]="items" class="w-100 medication-table">

    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

    <!-- Id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Id</th>
      <td mat-cell *matCellDef="let element">{{ element.id }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="text-center w-25">Name</th>
      <td mat-cell *matCellDef="let element" class="text-center w-25">{{ element.name }}</td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef class="text-start w-20">Category</th>
      <td mat-cell *matCellDef="let element" class="text-start w-20">{{ element.category }}</td>
    </ng-container>

    <!-- Quantity Column -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef class="text-center w-10">Quantity</th>
      <td mat-cell *matCellDef="let element" class="text-center w-10">{{ element.quantity }}</td>
    </ng-container>

    <!-- Created At Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef class="text-center w-20">Created At</th>
      <td mat-cell *matCellDef="let element" class="text-center w-20">{{ element.createdAt | date: 'dd-MM-yyyy HH:mm' }}</td>
    </ng-container>

    <!-- Updated At Column -->
    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef class="text-center w-20">Updated At</th>
      <td mat-cell *matCellDef="let element" class="text-center w-20">{{ element.updatedAt | date: 'dd-MM-yyyy HH:mm' }}</td>
    </ng-container>

    <!-- Actions At Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-center w-10">Actions</th>
      <td mat-cell *matCellDef="let element" class="text-center w-10">
        <button mat-icon-button color="primary" (click)="updateItem(element)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="deleteItem(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Columns -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns; trackBy: trackById"></tr>
  </table>
</div>

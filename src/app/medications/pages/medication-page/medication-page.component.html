<div class="medication-page-wrapper">
  <div class="container">
    <div class="card mb-4">
      <div class="card-body">
        <app-medication-form
        (save)="onSave($event)"
        [selected]="selected">
        </app-medication-form>
      </div>
    </div>

    <div class="card">
      <div class="card-body list-wrapper">
        <app-medication-list 
        [items]="items"
        (update)="onUpdate($event)"
        (delete)="onDelete($event)">
        </app-medication-list>
      </div>
    </div>

  </div>

</div>
